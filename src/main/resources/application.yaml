spring:
  application:
    name: mero-backend
  messages:
    encoding: UTF-8

  profiles:
    active: local

  jpa:
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
    encoding:
      charset: UTF-8
      enabled: true
      force: true

server:
  port: 8080